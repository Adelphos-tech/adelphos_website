name: Deploy to VPS

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 156.67.105.64
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            cd /var/www/adelphos_frontend
            echo "=== Git status before ==="
            git status
            echo "=== Fetching origin ==="
            git fetch origin
            echo "=== Resetting to origin/main ==="
            git reset --hard origin/main
            echo "=== Git status after ==="
            git status
            echo "=== Verifying blog files ==="
            ls -la blog/ | head -20
            echo "=== Installing deps ==="
            npm install --production
            echo "=== Restarting server ==="
            if command -v pm2 &> /dev/null; then
              pm2 restart adelphos-website || pm2 start server.js --name adelphos-website --cwd /var/www/adelphos_frontend
              pm2 save
            else
              echo "PM2 not found — server will need manual restart"
            fi
            echo "=== Done ==="
